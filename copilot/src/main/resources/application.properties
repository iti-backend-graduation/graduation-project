spring.application.name=copilot

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:copilot}
spring.datasource.username=${DB_USER:copilot}
spring.datasource.password=${DB_PASSWORD:copilot}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

# Gemini embeddings. Set GEMINI_API_KEY in the environment; never commit the key.
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.dimensions=768

# JWT. The secret has NO default on purpose: set JWT_SECRET in your own .env file.
copilot.security.jwt.secret=${JWT_SECRET:}
copilot.security.jwt.expiration=30m
