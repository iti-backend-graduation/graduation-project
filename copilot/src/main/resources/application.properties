spring.application.name=copilot

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:copilot}
spring.datasource.username=${DB_USER:copilot}
spring.datasource.password=${DB_PASSWORD:copilot}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

# JWT. The secret has NO default on purpose: set JWT_SECRET in your own .env file.
copilot.security.jwt.secret=${JWT_SECRET:}
copilot.security.jwt.expiration=30m
