spring.application.name=copilot

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME:copilot}
spring.datasource.username=${DB_USER:copilot}
spring.datasource.password=${DB_PASSWORD:copilot}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

# Gemini embeddings. Set GEMINI_API_KEY in the environment; never commit the key.
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=RETRIEVAL_DOCUMENT
spring.ai.google.genai.embedding.text.dimensions=768

# Gemini chat model for copilot answers (same GEMINI_API_KEY). Temperature 0 keeps answers repeatable.
spring.ai.model.chat=google-genai
spring.ai.google.genai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
spring.ai.google.genai.chat.options.temperature=0.0
# Gemini JSON mode: without it, about half of the replies in a manual check were cut off mid-JSON.
spring.ai.google.genai.chat.options.response-mime-type=application/json

# Hybrid retrieval: semantic hits below this cosine similarity are ignored.
copilot.retrieval.min-similarity=0.5

# JWT. The secret has NO default on purpose: set JWT_SECRET in your own .env file.
copilot.security.jwt.secret=${JWT_SECRET:}
copilot.security.jwt.expiration=30m

# Estimated AI prices in USD per one million tokens. PLACEHOLDER values for the capstone estimate:
# adjust them to the real model's price list.
copilot.ai.pricing.input-per-million-tokens=0.10
copilot.ai.pricing.output-per-million-tokens=0.40

# Teams agreed on version RANGES per module (audit V2-V19, knowledge V20-V39, ...), so a lower-numbered
# migration can arrive after a higher one is already applied. Allow Flyway to apply it.
spring.flyway.out-of-order=true

# One JSON object per log line; MDC entries such as correlationId become top-level fields
logging.structured.format.console=logstash

# Health and readiness. Only "health" is exposed; anonymous callers see the status, never the details.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
