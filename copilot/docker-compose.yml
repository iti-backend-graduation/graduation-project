services:
  db:
    image: pgvector/pgvector:pg16
    container_name: copilot-db
    environment:
      POSTGRES_DB: ${DB_NAME:-copilot}
      POSTGRES_USER: ${DB_USER:-copilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-copilot}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - copilot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-copilot} -d ${DB_NAME:-copilot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: copilot-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside Docker the database host is the service name "db", not localhost
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-copilot}
      DB_USER: ${DB_USER:-copilot}
      DB_PASSWORD: ${DB_PASSWORD:-copilot}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 characters) in your .env file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"

volumes:
  copilot-db-data:
