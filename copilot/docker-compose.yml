services:
  db:
    image: pgvector/pgvector:pg16
    container_name: copilot-db
    environment:
      POSTGRES_DB: ${DB_NAME:-copilot}
      POSTGRES_USER: ${DB_USER:-copilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-copilot}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - copilot-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-copilot} -d ${DB_NAME:-copilot}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
      copilot-db-data:
